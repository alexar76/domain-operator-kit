<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Domain Operator Kit — A home for what agents build.</title>
  <desc id="desc">An agent obtains a signed quote, registers a domain and connects it to a deployed project. Independent suppliers, fixed markup and owner-controlled DNS. Version 0.1, sandbox first.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1824"/><stop offset="1" stop-color="#050b12"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#75f5c7"/><stop offset="1" stop-color="#62c4f6"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#89c3d5" stroke-opacity=".055"/></pattern>
    <radialGradient id="glow"><stop stop-color="#165864" stop-opacity=".4"/><stop offset="1" stop-color="#165864" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="640" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="24" fill="url(#grid)"/>
  <ellipse cx="1020" cy="300" rx="330" ry="300" fill="url(#glow)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(64 51)">
      <rect width="34" height="34" rx="10" fill="#75f5c7"/>
      <path d="M10 9h7c12 0 12 16 0 16h-7z" fill="none" stroke="#07131b" stroke-width="3"/>
      <text x="48" y="24" font-size="20" font-weight="700" fill="#e8f3f6">DOMAIN OPERATOR KIT</text>
    </g>
    <rect x="1038" y="54" width="178" height="29" rx="14" fill="#132630" stroke="#2b454f"/>
    <circle cx="1056" cy="69" r="4" fill="#75f5c7"/>
    <text x="1070" y="74" font-size="12" font-weight="700" letter-spacing="1" fill="#b6d1db">v0.1 · SANDBOX FIRST</text>
    <text x="64" y="175" font-size="13" font-weight="700" letter-spacing="3" fill="#75f5c7">DOMAIN COMMERCE FOR AI AGENTS</text>
    <text x="60" y="248" font-size="64" font-weight="700" letter-spacing="-2" fill="#f3f7f9">A home for</text>
    <text x="60" y="320" font-size="64" font-weight="700" letter-spacing="-2" fill="#f3f7f9">what agents build.</text>
    <text x="64" y="370" font-size="20" fill="#a4bac7">Sell domains. Keep your supplier.</text>
    <text x="64" y="400" font-size="20" fill="#a4bac7">Set a fixed markup. Let agents connect.</text>
    <g transform="translate(64 444)" font-size="13" font-weight="700" fill="#d1e3eb">
      <rect width="84" height="34" rx="7" fill="#122530" stroke="#29424e"/><text x="21" y="22">MCP</text>
      <rect x="96" width="123" height="34" rx="7" fill="#122530" stroke="#29424e"/><text x="112" y="22">x402 / USDC</text>
      <rect x="231" width="150" height="34" rx="7" fill="#122530" stroke="#29424e"/><text x="247" y="22">YOUR PROVIDER</text>
    </g>
    <g transform="translate(760 151)">
      <rect x="26" y="-16" width="430" height="330" rx="16" fill="#10212b" stroke="#203945" opacity=".6"/>
      <rect width="430" height="330" rx="16" fill="#0d1b25" stroke="#355563"/>
      <path d="M16 0h398q16 0 16 16v40H0V16Q0 0 16 0" fill="#142833"/>
      <circle cx="24" cy="28" r="4" fill="#557380"/><circle cx="40" cy="28" r="4" fill="#557380"/><circle cx="56" cy="28" r="4" fill="#557380"/>
      <text x="82" y="33" font-size="12" letter-spacing="1" fill="#a8c4d1">AGENT → DOMAIN OPERATOR</text>
      <text x="26" y="96" font-size="12" letter-spacing="2" fill="#80a0b1">YOUR NEXT PROJECT</text>
      <text x="24" y="141" font-size="35" font-weight="700" fill="#e8f3f6">your-next-idea.com</text>
      <line x1="26" y1="165" x2="404" y2="165" stroke="#29424e"/>
      <g font-size="15" fill="#c6dce6">
        <circle cx="34" cy="196" r="10" fill="#153b33"/><text x="30" y="201" font-size="12" fill="#75f5c7">1</text><text x="55" y="201">Quote with a fixed markup</text>
        <circle cx="34" cy="235" r="10" fill="#153b33"/><text x="30" y="240" font-size="12" fill="#75f5c7">2</text><text x="55" y="240">Register to the real owner</text>
        <circle cx="34" cy="274" r="10" fill="#153b33"/><text x="30" y="279" font-size="12" fill="#75f5c7">3</text><text x="55" y="279">Configure DNS · connect Vercel</text>
      </g>
    </g>
    <path d="M760 505h430" stroke="url(#accent)" stroke-width="2"/>
    <text x="760" y="531" font-size="12" letter-spacing="1" fill="#84a8b9">ILLUSTRATIVE FLOW · NO LIVE DOMAIN OFFER</text>
    <path d="M64 560h1152" stroke="#203540"/>
    <text x="64" y="600" font-size="13" letter-spacing="1.2" fill="#8ba9ba">SIGNED QUOTES</text>
    <text x="302" y="600" font-size="13" letter-spacing="1.2" fill="#8ba9ba">DURABLE ORDERS</text>
    <text x="557" y="600" font-size="13" letter-spacing="1.2" fill="#8ba9ba">OWNER-CONTROLLED DNS</text>
    <text x="961" y="600" font-size="13" letter-spacing="1.2" fill="#75f5c7">BUILT ON AIMARKET RAILS</text>
  </g>
</svg>
