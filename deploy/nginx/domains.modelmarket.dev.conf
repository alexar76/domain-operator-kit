# domains.modelmarket.dev — modelmarket.dev's own node of the Domain Operator Kit, in DOMAIN_MODE=auto:
# a public demo (real RDAP availability, illustrative prices, register/renew refused with demo_mode)
# until every live setting is in /opt/domains-node/node.env and its secret files; then it sells.
#   seller node       container domains-node        127.0.0.1:9495  (data /opt/domains-node/data)
#   federation node   container domains-federation  127.0.0.1:9496  (/opt/domains-federation; listed on hubs)
# The seller's routes sit at the root because DOMAIN_PUBLIC_URL is the bare origin: order_url and the
# owner signatures name https://domains.modelmarket.dev/<route>. The site root is the kit's landing and
# /desk/ its example desk (static, domain-kit/docs/landing, published by its deploy.sh to
# /var/www/domains-landing); both call the seller routes on this same origin.
server {
    listen 80;
    listen [::]:80;
    server_name domains.modelmarket.dev;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name domains.modelmarket.dev;
    ssl_certificate     /etc/letsencrypt/live/domains.modelmarket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domains.modelmarket.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;

    # Federation node: hubs read the signed manifest and invoke domains.quote@v1 through it.
    location = /.well-known/ai-market.json {
        proxy_pass http://127.0.0.1:9496;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /ai-market/ {
        proxy_pass http://127.0.0.1:9496;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Seller node: quote, register, renew, status, info, dns, transfer-code, listing.json, healthz.
    location ~ ^/(quote|quote/invoke|register|renew|status|info|dns/get|dns/set|transfer-code|listing\.json|healthz)$ {
        proxy_pass http://127.0.0.1:9495;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # The landing and the desk. No third-party script: everything they load and call is this origin,
    # three.js included (assets/vendor/three). The hash allows the landing's inline import map only;
    # domain-kit/test/landing.test.js fails if the map changes without this line.
    root /var/www/domains-landing;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    set $landing_csp "default-src 'self'; script-src 'self' 'sha256-Ar2H6vAaom3O3N7m8mcnoySPhQKmIAWL4HppxZWJ1vA='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";
    location = / {
        try_files /index.html =404;
        add_header Content-Security-Policy $landing_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=300";
    }
    location = /desk { return 301 /desk/; }
    location = /desk/ {
        try_files /desk/index.html =404;
        add_header Content-Security-Policy $landing_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=300";
    }
    location ~ ^/assets/vendor/[\w./-]+\.js$ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=604800";
    }
    location ~ ^/assets/(?:[\w-]+/)*[\w.-]+\.(js|css)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=300";
    }
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        try_files $uri =404;
    }

    # Old links to the root went to the kit on GitHub; anything unknown now lands on the landing.
    location / { return 302 /; }
}
